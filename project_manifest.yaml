id: ai-controltower
name: ai-controltower
description: >
  Centre local de fiabilisation pour développement assisté par IA avec
  Aider, Ollama et le modèle ornith:9b. Cockpit Flask local, launchers
  Windows, policies, prompts, skills et outils de pilotage.
status: active
owner: Michael Introligator
category: ia
tags: [aider, ollama, ia-locale, cockpit, windows]

repo:
  type: github
  path: https://github.com/MadOff-33/ai-controltower
  default_branch: main

stack:
  - Python
  - Flask (cockpit UI)
  - Aider
  - Ollama (ornith:9b)
  - Scripts CMD Windows

launch_commands:
  - ControlTower.cmd                # point d'entrée racine (cockpit Flask local)

test_commands: []

ai_modules:
  - key: aider-ollama
    name: Aider + Ollama local
    role: Développement assisté par IA en local (modèle ornith:9b), policies et prompts versionnés
    criticality: normal
    config_files:
      - policies
      - prompts
      - skills

